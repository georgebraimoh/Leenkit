# Continuous integration: checks only. Nothing here deploys, applies
# migrations to a real database, or needs production secrets.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Build, lint, tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install (lockfile)
        run: npm ci

      - name: Secret scan (tracked files)
        run: npm run check:secrets

      - name: Lint (fails on errors)
        run: npm run lint

      - name: Production build
        run: npm run build
        env:
          # Placeholders: the build only embeds these; no network calls happen.
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder-anon-key

      - name: Email unit tests (fake Resend + fake Supabase)
        run: npm run test:email

      - name: Database tests (all migrations replayed into in-memory Postgres)
        run: npm run test:db

  edge-functions:
    name: Edge Functions type-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: deno check
        run: |
          for f in supabase/functions/*/index.ts; do
            echo "::group::$f"
            deno check "$f"
            echo "::endgroup::"
          done
